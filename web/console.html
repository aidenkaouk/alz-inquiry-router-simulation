<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Triage Console (Demo)</title>
  <link rel="stylesheet" href="css/console.css">
</head>
<body>
  <div class="demo-banner">Demo, not the official alz.org. Invented data. Staff approve every case; nothing is sent to anyone.</div>
  <header class="bar">
    <h1>Triage Console</h1>
    <span class="who">Signed in as Beatrice Lowell, Constituent Triage Lead (demo)</span>
  </header>

  <div class="layout">
    <aside class="queue">
      <h2>Queue</h2>
      <p class="muted" id="queue-empty" hidden>No cases yet. Submit one from the Contact Us form.</p>
      <ul id="queue"></ul>
      <h2 id="followup-head" hidden>Follow-up</h2>
      <ul id="followup"></ul>
    </aside>

    <main id="detail" class="detail">
      <p class="muted">Select a case from the queue.</p>
    </main>
  </div>

  <script src="js/console.js"></script>
</body>
</html>
